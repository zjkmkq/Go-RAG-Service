# PostgreSQL 16 + pgvector — Go-RAG-Service 开发环境
# 启动: docker compose up -d
# 停止: docker compose down
# 清空数据: docker compose down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
